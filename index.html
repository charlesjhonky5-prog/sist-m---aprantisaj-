/* =====================================================
   CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey:"AIzaSyDAp0p5YyL4MbZKdcXwtO-Q6IDRaHc2VMw",
  authDomain:"sis-f-a.firebaseapp.com",
  projectId:"sis-f-a",

const firebaseApp =

/* =====================================================
   LOADING
===================================================== */

function hideLoading(){

  const loading =
    document.getElementById("loadingOverlay");

  if(loading){
    loading.style.display="none";
  }
}


/* =====================================================
   AUTH MESSAGE
===================================================== */

function showAuthMsg(message,type="error"){

  const box =
    document.getElementById("authMsg");

  if(!box) return;

  box.textContent=message;

  box.className=
    "authMsg "+type;
}


/* =====================================================
   FIREBASE PERSISTENCE
===================================================== */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* =====================================================
   ROLE LABEL
===================================================== */

function roleLabel(role){

  switch(role){

    case "administrateur":
      return "Administratè";

    case "professeur":
      return "Pwofesè";

    case "eleve":
      return "Elèv";

    default:
      return "Utilisateur";

  }
}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

window.connecterAvecGoogle =
async function(){

  try{

    showAuthMsg(
      "Koneksyon Google an ap fèt...",
      "success"
    );

    try{

      const result =
        await signInWithPopup(
          auth,
          provider
        );

      if(result && result.user){
        await handleUser(result.user);
      }

    }catch(popupError){

      console.warn(
        "Popup Google pa mache:",
        popupError
      );

      /*
       Sou kèk telefòn/Chrome,
       popup ka bloke.
       Nou itilize redirect.
      */

      if(
        popupError.code ===
        "auth/popup-blocked" ||

        popupError.code ===
        "auth/popup-closed-by-user" ||

        popupError.code ===
        "auth/cancelled-popup-request"
      ){

        await signInWithRedirect(
          auth,
          provider
        );

      }else{

        throw popupError;

      }

    }

  }catch(error){

    console.error(
      "ERÈ GOOGLE:",
      error
    );

    showAuthMsg(
      "Erè Google: "+error.message,
      "error"
    );

    hideLoading();

  }

};

  if(!email || !password){

  }

  try{

    showAuthMsg(
      "Koneksyon an ap fèt...",
      "success"
    );

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,

      );

    await handleUser(result.user);

  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error

    showAuthMsg(
      "Erè koneksyon: "+error.message,

async function(){

  const prenom =

      .getElementById("registerPrenom")
      .value
      .trim();

  const nom =
    document
      .getElementById("registerNom")
      .value
      .trim();

  const email =

      .getElementById("registerEmail")
      .value
      .trim();

      .value;

  if(!prenom || !nom || !email || !password){

      "error"
    );

  }

  try{

    showAuthMsg(
      "Kreyasyon kont lan...",
      "success"
    );

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user =
      result.user;

    await updateProfile(

      {
        displayName:

      }
    );

      uid:user.uid,

      nom:nom,

      prenom:prenom,

      email:user.email || email,

    };

    await setDoc(
      doc(db,"users",user.uid),
      profile
    );

    showAuthMsg(
      "Kont lan kreye. Administratè a dwe valide li.",
      "success"
    );

    await signOut(auth);

  }catch(error){

    console.error(
      "REGISTER ERROR:",
      error
    );

    showAuthMsg(
      "Erè kreyasyon kont: "+error.message,
      "error"
    );

  }

};


/* =====================================================
   KOREKSYON PRINCIPAL ADMIN
===================================================== */

async function handleUser(user){

  if(!user) return;

  /*
    Evite menm itilizatè a trete
    plizyè fwa an menm tan.
  */

  if(handlingUserUid === user.uid){
    return;
  }

  handlingUserUid =
    user.uid;

  currentUser =
    user;

  try{

    const ref =
      doc(
        db,
        "users",
        user.uid
      );

    const snap =
      await getDoc(ref);


    /* =================================================
       NOUVO ITILIZATÈ
    ================================================= */

    if(!snap.exists()){

      const nameParts =
        (user.displayName || "")
          .trim()
          .split(/\s+/);

      const profile={

        uid:user.uid,

        nom:
          nameParts
            .slice(1)
            .join(" ") || "",

        prenom:
          nameParts[0] || "",

        displayName:
          user.displayName ||
          user.email?.split("@")[0] ||
          "Utilisateur",

        email:
          user.email || "",

        role:"",

        status:"pending",

        provider:"google",

        createdAt:
          serverTimestamp()

      };

      await setDoc(
        ref,
        profile,
        {merge:true}
      );

      currentUserProfile =
        profile;

      document
        .getElementById("app")
        .style.display="none";

      document
        .getElementById("loginBox")
        .style.display="flex";

      showAuthMsg(
        "Kont ou an attente. Administratè a dwe valide kont lan.",
        "error"
      );

      await signOut(auth);

      hideLoading();

      return;
    }


    /* =================================================
       LI USER LA
    ================================================= */

    const data =
      snap.data();


    const role =
      String(
        data.role || ""
      )
      .trim()
      .toLowerCase();


    const status =
      String(
        data.status || ""
      )
      .trim()
      .toLowerCase();


    const firestoreUid =
      String(
        data.uid || ""
      )
      .trim();


    const firestoreEmail =
      String(
        data.email || ""
      )
      .trim()
      .toLowerCase();


    const firebaseEmail =
      String(
        user.email || ""
      )
      .trim()
      .toLowerCase();


    currentUserProfile={

      uid:user.uid,

      ...data,

      role,

      status

    };


    console.log(
      "========== USER CHECK =========="
    );

    console.log(
      "Firebase UID:",
      user.uid
    );

    console.log(
      "Firestore UID:",
      firestoreUid
    );

    console.log(
      "Firebase Email:",
      firebaseEmail
    );

    console.log(
      "Firestore Email:",
      firestoreEmail
    );

    console.log(
      "Role:",
      role
    );

    console.log(
      "Status:",
      status
    );

    console.log(
      "================================"
    );


    /* =================================================
       ADMINISTRATÈ
       
       ADMIN PA ANTRE SOU ROLE SELMAN.
       4 bagay dwe egzak:
       1. UID
       2. role
       3. status
       4. email
    ================================================= */

    const adminOK =

      firestoreUid === user.uid &&

      role === "administrateur" &&

      status === "accepted" &&

      firestoreEmail === firebaseEmail;


    if(adminOK){

      console.log(
        "✅ ADMIN OK - AKSEPTE"
      );


      document
        .getElementById("loginBox")
        .style.display="none";

      document
        .getElementById("app")
        .style.display="block";


      document
        .getElementById("userEmail")
        .textContent =
          user.email ||
          data.email ||
          "";


      document
        .getElementById("userName")
        .textContent =
          data.displayName ||
          user.displayName ||
          "Administratè";


      document
        .getElementById("userRole")
        .textContent =
          "Administratè";


      if(user.photoURL){

        document
          .getElementById("userPhoto")
          .src =
            user.photoURL;

      }


      await chargerToutFirebase();

      convertirNotesAnciennes();

      actualiserTout();

      appliquerPermissions();


      hideLoading();

      return;
    }


    /* =================================================
       SI KONT PA AKSEPTE
    ================================================= */

    if(status !== "accepted"){

      console.log(
        "⛔ KONT PA AKSEPTE"
      );


      document
        .getElementById("app")
        .style.display="none";


      document
        .getElementById("loginBox")
        .style.display="flex";


      showAuthMsg(
        "Kont ou poko valide. Administratè a dwe aksepte kont lan.",
        "error"
      );


      await signOut(auth);

      hideLoading();

      return;
    }


    /* =================================================
       ITILIZATÈ AKSEPTE
    ================================================= */

    document
      .getElementById("loginBox")
      .style.display="none";

    document
      .getElementById("app")
      .style.display="block";


    document
      .getElementById("userEmail")
      .textContent =
        user.email ||
        data.email ||
        "";


    document
      .getElementById("userName")
      .textContent =
        data.displayName ||
        user.displayName ||
        "Utilisateur";


    document
      .getElementById("userRole")
      .textContent =
        roleLabel(role);


    if(user.photoURL){

      document
        .getElementById("userPhoto")
        .src =
          user.photoURL;

    }


    await chargerToutFirebase();

    convertirNotesAnciennes();

    actualiserTout();

    appliquerPermissions();

    hideLoading();


  }catch(error){

    console.error(
      "❌ ERÈ HANDLE USER:",
      error
    );


    document
      .getElementById("app")
      .style.display="none";


    document
      .getElementById("loginBox")
      .style.display="flex";


    showAuthMsg(
      "Erè pandan verifikasyon kont lan: "+
      error.message,
      "error"
    );


    hideLoading();

  }finally{

    handlingUserUid=null;

  }

}

/* =====================================================
   FIRESTORE SAVE
===================================================== */

window.firebaseSaveData =
async function(key,data){

  try{

    for(
      const item of data
    ){

      if(
        !item ||
        item.id === undefined ||
        item.id === null
      ){
        continue;
      }

      await setDoc(
        doc(
          db,
          key,
          String(item.id)
        ),
        item,
        {merge:true}
      );

    }

    console.log(
      "Firebase OK:",
      key
    );

  }catch(error){

    console.error(
      "Firebase SAVE ERROR:",
      key,
      error
    );

    throw error;

  }

};


/* =====================================================
   GET DATA LOCAL
===================================================== */

function getData(key){

  try{

    return JSON.parse(
      localStorage.getItem(key) || "[]"
    );

  }catch(error){

    return [];

  }

}


/* =====================================================
   SAVE DATA LOCAL + FIREBASE
===================================================== */

async function saveData(key,data){

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

  try{

    await window.firebaseSaveData(
      key,
      data
    );

  }catch(error){

    console.error(
      "Sync Firebase:",
      error
    );

  }

}


/* =====================================================
   CHARGE DONE FIREBASE
===================================================== */

async function chargerToutFirebase(){

  for(
    const key of DATA_KEYS
  ){

    try{

      const snapshot =
        await getDocs(
          collection(db,key)
        );

      const data=[];

      snapshot.forEach(
        item=>{

          data.push(
            item.data()
          );

        }
      );

      if(data.length > 0){

        localStorage.setItem(
          key,
          JSON.stringify(data)
        );

      }

    }catch(error){

      console.warn(
        "Pa ka chaje:",
        key,
        error
      );

    }

  }

}

  const found =
    eleves.filter(

            <p>

          `
        ).join("")

};

function appliquerPermissions(){

  const role =
    currentUserProfile?.role || "";


  const utilisateurs =
    document.getElementById(
      "utilisateurs"
    );

  if(
    utilisateurs &&
    role !== "administrateur"
  ){

    utilisateurs.style.display="none";

  }


  if(
    role === "administrateur"
  ){

    if(utilisateurs){

      utilisateurs.style.display="block";

    }

  }

}


/* =====================================================
   UTILIZATÈ
===================================================== */

async function chargerUtilisateurs(){

  const tbody =
    document.getElementById(
      "listeUtilisateurs"
    );

  if(!tbody) return;


  if(
    currentUserProfile?.role !==
    "administrateur"
  ){

    tbody.innerHTML="";

    return;

  }


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );


    tbody.innerHTML="";


    snapshot.forEach(
      item=>{

        const u =
          item.data();


        const role =
          String(
            u.role || ""
          )
          .trim()
          .toLowerCase();


        const status =
          String(
            u.status || ""
          )
          .trim()
          .toLowerCase();


        let badge =
          `<span class="badge badgeAttente">
             ${status || "pending"}
           </span>`;


        if(status === "accepted"){

          badge =
            `<span class="badge badgeProf">
              accepted
            </span>`;

        }


        tbody.innerHTML += `

          <tr>

            <td>
              ${u.displayName || ""}
            </td>

            <td>
              ${u.email || ""}
            </td>

            <td>
              ${roleLabel(role)}
            </td>

            <td>
              ${badge}
            </td>

            <td>

              ${
                status !== "accepted"

                ? `
                  <button
                    class="btn btnSuccess"
                    onclick="accepterUtilisateur('${item.id}')"
                  >
                    ✅ Aksepte
                  </button>
                `

                : ""
              }

              ${
                status === "accepted" &&
                item.id !== currentUser?.uid

                ? `
                  <button
                    class="btn btnDanger"
                    onclick="refuserUtilisateur('${item.id}')"
                  >
                    ❌ Retire
                  </button>
                `

                : ""
              }

            </td>

          </tr>

        `;

      }
    );

  }catch(error){

    console.error(
      "UTILISATEURS ERROR:",
      error
    );

  }

}


window.chargerUtilisateurs =
chargerUtilisateurs;


/* =====================================================

window.accepterUtilisateur =
async function(uid){

  if(
    currentUserProfile?.role !==
    "administrateur"
  ){

    alert(
      "Se administratè a ki ka fè sa."
    );

    return;

  }


  try{

    await setDoc(

      doc(
        db,
        "users",
        uid
      ),

      {
        status:"accepted"
      },

      {
        merge:true
      }

    );


    alert(
      "Kont lan aksepte."
    );


    await chargerUtilisateurs();

  }catch(error){

    console.error(error);

    alert(
      "Erè: "+error.message
    );

  }

};

window.exporterDonnees =
function(){

  const data={};

  DATA_KEYS.forEach(
    key=>{

      data[key]=
        getData(key);

    }
  );


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href=url;

  a.download=
    "sistem-aprantisaj-done.json";

  a.click();


  URL.revokeObjectURL(url);

};


/* =====================================================
   IMPORT DONE
===================================================== */

window.importerDonnees =
async function(event){

  const file =
    event.target.files[0];

  if(!file) return;


  try{

    const text =
      await file.text();

    const data =
      JSON.parse(text);


    for(
      const key of DATA_KEYS
    ){

      if(
        Array.isArray(data[key])
      ){

        await saveData(
          key,
          data[key]
        );

      }

    }


    actualiserTout();


    alert(
      "Done yo enpòte avèk siksè."
    );


  }catch(error){

    console.error(error);

    alert(
      "Fichye a pa valab."
    );

  }

};

function(){

  if(
